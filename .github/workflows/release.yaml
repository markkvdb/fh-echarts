name: Release to PyPI

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify tag matches __version__
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          PKG_VERSION=$(python -c "exec(open('fh_echarts/__init__.py').read()); print(__version__)")
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "❌ Tag ($TAG) does not match __version__ ($PKG_VERSION)"
            exit 1
          fi
          echo "✅ Tag and __version__ match: $TAG"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
